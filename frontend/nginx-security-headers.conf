# Security headers for responses nginx serves itself (the SPA, its assets and
# public media). Included per location because nginx drops inherited
# add_header directives in any location that declares its own.
# /api/ and /django-admin/ are proxied to Django, which sets its own headers.
add_header X-Content-Type-Options "nosniff" always;
# The admin "preview public site" screen frames the site from the same origin.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Inventory behind this policy (2026-10): scripts, styles and fonts are bundled
# and same-origin; React sets inline style attributes; the API is same-origin
# (/api); images come from /media, data:/blob: URLs and admin-entered https
# image links; frames are same-origin previews and blob: document previews.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
