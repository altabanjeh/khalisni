# Django admin sign-in is not an API view, so the API rate limits do not cover
# it. Five attempts a minute per address as seen by this nginx.
limit_req_zone $binary_remote_addr zone=django_admin_login:10m rate=5r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    # One request can carry several required documents (10 MB each).
    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
        # The HTML shell names the current asset hashes: always revalidate it.
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Hashed build output never changes. A missing chunk is a 404, not the
    # HTML shell, so a stale tab fails loudly instead of parsing HTML as script.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Serve the PWA manifest with the correct media type.
    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_read_timeout 120s;
    }

    location = /django-admin/login/ {
        limit_req          zone=django_admin_login burst=5 nodelay;
        limit_req_status   429;
        proxy_pass         http://backend:8000/django-admin/login/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   X-Forwarded-Host  $host;
    }

    location /django-admin/ {
        proxy_pass         http://backend:8000/django-admin/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   X-Forwarded-Host  $host;
    }

    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 1d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Uploaded media is private by default. nginx serves only the public
    # catalog/CMS folders listed below -- the same allowlist as
    # PUBLIC_MEDIA_PREFIXES in backend/config/urls.py. Customer documents
    # (secure_orders/), payment receipts and any folder added later are never
    # served here; they are fetched through /api/documents/<id>/download/,
    # which checks authorization (defect D1, KHS-035).
    location /media/ {
        return 404;
    }

    location ~ ^/media/(service_categories|services|public_site|organizations/branding|manual)/ {
        root /var/www;
        expires 1h;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
