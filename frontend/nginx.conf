server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Serve the PWA manifest with the correct media type.
    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
    }

    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_read_timeout 120s;
    }

    location /django-admin/ {
        proxy_pass         http://backend:8000/django-admin/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   X-Forwarded-Host  $host;
    }

    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Public catalog / CMS media is served directly. Sensitive uploads
    # (uploaded customer documents, payment receipts) must NOT be served by
    # nginx -- they are access-controlled and fetched through
    # /api/documents/<id>/download/ (defect D1).
    location /media/ {
        alias /var/www/media/;
        expires 1h;
        add_header Cache-Control "public";

        location ~ ^/media/(secure_orders|payments)/ {
            deny all;  # 403 -- use the authenticated API download endpoint
        }
    }
}
