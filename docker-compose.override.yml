# LOCAL DEVELOPMENT ONLY. Docker Compose applies this file automatically on a
# plain `docker compose up`. Coolify reads only docker-compose.yml.
# On a server always run:  docker compose -f docker-compose.yml up -d --build
# Ports are bound to loopback so a mistaken run cannot expose the database or
# the backend to the network.

services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DJANGO_SEED_INITIAL_DATA: "True"
    volumes:
      - ./backend:/app
      - backend_media:/app/media
      - backend_static:/app/staticfiles

  frontend:
    ports:
      - "127.0.0.1:4173:80"
