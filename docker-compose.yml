services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER:     ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Counters only: nothing here needs to survive a restart.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    expose:
      - "6379"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY:    ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_DEBUG:         ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_TIME_ZONE:     ${DJANGO_TIME_ZONE:-Asia/Amman}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-True}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-31536000}
      DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS:-True}
      DJANGO_SECURE_HSTS_PRELOAD: ${DJANGO_SECURE_HSTS_PRELOAD:-True}
      DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-True}
      DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-True}
      POSTGRES_DB:          ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER:        ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD:    ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST:        db
      POSTGRES_PORT:        "5432"
      FILE_UPLOAD_MAX_SIZE: ${FILE_UPLOAD_MAX_SIZE:-10485760}
      # Shared rate-limit counters. Without Redis each gunicorn worker counts alone.
      REDIS_URL:            ${REDIS_URL:-redis://redis:6379/0}
      GUNICORN_WORKERS:     ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT:     ${GUNICORN_TIMEOUT:-120}
      DJANGO_SEED_SERVICE_IMAGES: ${DJANGO_SEED_SERVICE_IMAGES:-True}
      DJANGO_LOG_LEVEL:     ${DJANGO_LOG_LEVEL:-INFO}
      # Reverse-proxy chain and rate limits (see docs/hardening/KHALSNI_PRODUCTION_ENV_REQUIREMENTS.md).
      # API_THROTTLE_NUM_PROXIES has no default on purpose: it must match the real proxy chain.
      API_THROTTLE_NUM_PROXIES: ${API_THROTTLE_NUM_PROXIES:-}
      API_THROTTLE_ANON_RATE: ${API_THROTTLE_ANON_RATE:-}
      API_THROTTLE_USER_RATE: ${API_THROTTLE_USER_RATE:-}
      API_THROTTLE_ORDER_TRACKING_RATE: ${API_THROTTLE_ORDER_TRACKING_RATE:-}
      API_THROTTLE_AUTH_LOGIN_RATE: ${API_THROTTLE_AUTH_LOGIN_RATE:-}
      API_THROTTLE_AUTH_REGISTER_RATE: ${API_THROTTLE_AUTH_REGISTER_RATE:-}
      API_THROTTLE_AUTH_PASSWORD_RESET_RATE: ${API_THROTTLE_AUTH_PASSWORD_RESET_RATE:-}
      FRONTEND_BASE_URL:    ${FRONTEND_BASE_URL:-}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-30}
      JWT_REFRESH_TOKEN_DAYS: ${JWT_REFRESH_TOKEN_DAYS:-7}
      PASSWORD_RESET_TOKEN_TTL_SECONDS: ${PASSWORD_RESET_TOKEN_TTL_SECONDS:-1800}
      PASSWORD_RESET_RATE_LIMIT_WINDOW_SECONDS: ${PASSWORD_RESET_RATE_LIMIT_WINDOW_SECONDS:-1800}
      PASSWORD_RESET_RATE_LIMIT_EMAIL: ${PASSWORD_RESET_RATE_LIMIT_EMAIL:-3}
      PASSWORD_RESET_RATE_LIMIT_IP: ${PASSWORD_RESET_RATE_LIMIT_IP:-10}
      DJANGO_ADMIN_EMAIL:    ${DJANGO_ADMIN_EMAIL:-}
      DJANGO_ADMIN_PASSWORD: ${DJANGO_ADMIN_PASSWORD:-}
      DJANGO_ADMIN_NAME:     ${DJANGO_ADMIN_NAME:-Admin}
      DJANGO_ADMIN_RESET_PASSWORD: ${DJANGO_ADMIN_RESET_PASSWORD:-False}
      DJANGO_SEED_INITIAL_DATA: ${DJANGO_SEED_INITIAL_DATA:-False}
      DJANGO_EMAIL_BACKEND:    ${DJANGO_EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      DJANGO_EMAIL_HOST:       ${DJANGO_EMAIL_HOST:-localhost}
      DJANGO_EMAIL_PORT:       ${DJANGO_EMAIL_PORT:-587}
      DJANGO_EMAIL_HOST_USER:  ${DJANGO_EMAIL_HOST_USER:-}
      DJANGO_EMAIL_HOST_PASSWORD: ${DJANGO_EMAIL_HOST_PASSWORD:-}
      DJANGO_EMAIL_USE_TLS:    ${DJANGO_EMAIL_USE_TLS:-True}
      DJANGO_EMAIL_USE_SSL:    ${DJANGO_EMAIL_USE_SSL:-False}
      DJANGO_DEFAULT_FROM_EMAIL: ${DJANGO_DEFAULT_FROM_EMAIL:-no-reply@khalisni.local}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
      AWS_S3_REGION_NAME:      ${AWS_S3_REGION_NAME:-}
      AWS_S3_ENDPOINT_URL:     ${AWS_S3_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID:       ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY:   ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_ACL:         ${AWS_DEFAULT_ACL:-private}
    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"from urllib.request import Request, urlopen; import sys; req = Request('http://127.0.0.1:8000/api/health/', headers={'Host': 'localhost', 'X-Forwarded-Proto': 'https'}); sys.exit(0 if urlopen(req).status == 200 else 1)\"",
        ]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 180s
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    expose:
      - "80"
    volumes:
      - backend_media:/var/www/media:ro
      - backend_static:/var/www/static:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  backend_media:
  backend_static:
