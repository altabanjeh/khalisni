name: CI

on:
  push:
    branches: ["main", "dev", "hardening/**"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Check for pending migrations
        working-directory: backend
        env:
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: ci-only-insecure-key
        run: python manage.py makemigrations --check

      - name: Run system check
        working-directory: backend
        env:
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: ci-only-insecure-key
        run: python manage.py check

      - name: Run tests
        working-directory: backend
        env:
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: ci-only-insecure-key
        run: python manage.py test --verbosity=2

  backend-postgres:
    name: Backend tests on PostgreSQL
    runs-on: ubuntu-latest
    # Production runs PostgreSQL. SQLite has no row locks, so the concurrency
    # tests are skipped there; this job is the one that executes them.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: khalsni_ci
          POSTGRES_USER: khalsni_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U khalsni_ci -d khalsni_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ci-only-insecure-key
      POSTGRES_DB: khalsni_ci
      POSTGRES_USER: khalsni_ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Apply migrations from scratch
        working-directory: backend
        run: python manage.py migrate --noinput
      - name: Run tests
        working-directory: backend
        run: python manage.py test --verbosity=1

  deploy-artifacts:
    name: Deployment artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Production settings check
        working-directory: backend
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: ci-check-deploy-key-not-a-real-secret-0123456789abcdefghijklmnop
          DJANGO_ALLOWED_HOSTS: app.example.com
          CORS_ALLOWED_ORIGINS: https://app.example.com
        run: |
          pip install -r requirements.txt
          python manage.py check --deploy --fail-level ERROR
      - name: Compose file is valid without the development override
        env:
          POSTGRES_DB: x
          POSTGRES_USER: x
          POSTGRES_PASSWORD: x
          DJANGO_SECRET_KEY: x
        run: docker compose -f docker-compose.yml config -q
      - name: Backup and restore scripts parse
        run: sh -n scripts/backup.sh && sh -n scripts/restore.sh
      - name: Build images
        run: |
          docker build -t khalsni-backend:ci backend
          docker build -t khalsni-frontend:ci frontend
      - name: nginx configuration loads
        run: docker run --rm --add-host backend:127.0.0.1 khalsni-frontend:ci nginx -t

  backend-security:
    name: Backend dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit backend dependencies
        run: pip-audit -r backend/requirements.txt --strict

  frontend:
    name: Frontend tests + lint + build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Run unit tests
        working-directory: frontend
        run: npm test

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2E + accessibility suite
        working-directory: frontend
        env:
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: ci-only-insecure-key
        run: npm run e2e
      - name: Run role-journey suites (isolated QA fixtures)
        working-directory: frontend
        env:
          E2E_QA_MODE: "1"
          E2E_DB_PATH: ../frontend/e2e-results/e2e_qa_db.sqlite3
        run: |
          # Throwaway password for the fixture accounts of this run only.
          KHALSNI_QA_PASSWORD="Qa-$(openssl rand -hex 12)-Zz9!"
          export KHALSNI_QA_PASSWORD
          npx playwright test client-audit hardening --project=desktop-1440
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  mobile:
    name: Mobile type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        working-directory: mobile
        run: npm ci
      - name: Type-check
        working-directory: mobile
        run: npm run typecheck
